# TEMPORARY fork-only experiment: simulates snapshot.yml's role as the
# master-side cache producer, on this test branch's scope.
name: cache-producer
on:
  workflow_dispatch:
jobs:
  produce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Workspace Environment Variable
        run: echo "WORKSPACE=${{ github.workspace }}" >> $GITHUB_ENV
      - name: Populate ~/.m2 with a real build
        run: xvfb-run mvn clean verify -f ./ddk-parent/pom.xml --batch-mode --fail-at-end -Dcheckstyle.skip=true -Dpmd.skip=true -Dspotbugs.skip=true
      - name: Save producer cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: /home/runner/.m2/repository
          key: Linux-maven-publish-test-${{ github.run_id }}

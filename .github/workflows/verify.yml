# TEMPORARY TEST WORKFLOW — fork-only experiment for the restore-keys cache
# mechanism (PR never to be merged). The real verify.yml lives on master; this
# branch guts everything except the cache step so each run takes ~30s.
name: verify
on:
  pull_request:
jobs:
  maven-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Cache Maven dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: /home/runner/.m2/repository
          key: ${{ runner.os }}-maven-0-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-0-
      - name: Show restored marker (proves restored content, not just key match)
        run: cat /home/runner/.m2/repository/cache-proof.txt 2>/dev/null || echo "NO MARKER (cache was empty/missing)"
      - name: Populate cache content (test marker)
        run: mkdir -p /home/runner/.m2/repository && date > /home/runner/.m2/repository/cache-proof.txt && cat /home/runner/.m2/repository/cache-proof.txt

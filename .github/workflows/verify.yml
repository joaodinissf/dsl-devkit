name: verify
on:
  push:
    branches: [master]
  pull_request:
jobs:
  line-endings:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Check LF line endings in index
        # .gitattributes declares `* text=auto eol=lf` with .bat/.cmd/.ps1 exempted.
        # Git's clean filter normalizes on commit, but verify it explicitly in case a
        # file is miscategorized as binary or a filter is bypassed.
        run: |
          violations=$(git ls-files --eol \
            | grep -E "^i/(crlf|mixed)" \
            | grep -vE "\.(bat|cmd|ps1)$" || true)
          if [ -n "$violations" ]; then
            echo "Files with CRLF/mixed line endings stored in the index:"
            echo "$violations"
            exit 1
          fi

  static-analysis:
    # Two sequential `mvn` invocations within one job:
    #   1. PMD + CPD + Checkstyle generate reports (--fail-never so per-module check
    #      throws don't halt the reactor; complete report coverage)
    #   2. Python step parses the reports and acts as the workflow-level gate
    #      (exits 1 if any violation, which skips step 3)
    #   3. SpotBugs runs only when step 2 passed — fail-fast on PMD/CS, ~7m saved
    #      on red runs
    # Maven's `--fail-never` lets the reactor finish all modules before any failure
    # is final, so XML reports exist for every module regardless of which violated.
    # Compile errors halt the reactor at compile phase; they're not silenced by
    # `--fail-never` because compile throws MojoExecutionException, not just
    # MojoFailureException. The parallel `maven-verify` job catches them too.
    runs-on: ubuntu-24.04
    env:
      MAVEN_OPTS: -Xmx4g
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Workspace Environment Variable
        run: echo "WORKSPACE=${{ github.workspace }}" >> $GITHUB_ENV
      - name: Cache Maven dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: /home/runner/.m2/repository
          key: ${{ runner.os }}-maven-0-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-0-
      - name: PMD + CPD + Checkstyle
        run: |
          mvn -T 2C -f ./ddk-parent/pom.xml --batch-mode --fail-never \
            compile \
            pmd:check pmd:cpd-check checkstyle:check
      - name: Annotate PMD/CPD/Checkstyle violations (gate)
        if: always()
        run: python3 .github/scripts/annotate-violations.py --pmd --cpd --checkstyle
      - name: SpotBugs
        run: |
          mvn -T 2C -f ./ddk-parent/pom.xml --batch-mode --fail-never \
            compile \
            spotbugs:check
      - name: Annotate SpotBugs
        if: always()
        run: python3 .github/scripts/annotate-violations.py --spotbugs

  maven-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Log Maven version
        run: mvn --version
      - name: Set up Workspace Environment Variable
        run: echo "WORKSPACE=${{ github.workspace }}" >> $GITHUB_ENV
      - name: Cache Maven dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: /home/runner/.m2/repository
          key: ${{ runner.os }}-maven-0-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-0-
      - name: Build with Maven within a virtual X Server Environment
        run: xvfb-run mvn clean verify -f ./ddk-parent/pom.xml --batch-mode --fail-at-end
      - name: Fail on missing surefire reports
        # Tycho-Surefire writes no TEST-*.xml when discovery is empty — fail the job in that case.
        if: always()
        run: |
          if ! find . -path '*/target/surefire-reports/TEST-*.xml' -print -quit | grep -q .; then
            echo "::error::No surefire reports found. Test discovery is likely broken."
            exit 1
          fi
      - name: Archive Tycho Surefire Plugin
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: tycho-surefire-plugin
          path: ${{ env.GITHUB_WORKSPACE }}/com.avaloq.tools.ddk.xtext.test/target/work/data/.metadata/.log

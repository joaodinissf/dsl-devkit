name: verify-annotation-fixture
on:
  pull_request:
permissions:
  contents: read
  security-events: write
jobs:
  annotations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Merge a real SpotBugs finding with a clean sibling
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/sarif.sh
          mkdir -p .validation-fixture/a/target .validation-fixture/b/target
          cp .github/tests/analysis/fixtures/spotbugs-clean.json .validation-fixture/a/target/spotbugsSarif.json
          jq --arg root "file://${GITHUB_WORKSPACE}/.github/tests/analysis/annotation-source/" \
            '.runs[].originalUriBaseIds[] |= (.uri = $root)' \
            .github/tests/analysis/fixtures/spotbugs-finding.json > .validation-fixture/b/target/spotbugsSarif.json
          merge_sarif spotbugsSarif.json .sarif-merged/spotbugs.sarif '.validation-fixture/a .validation-fixture/b' SpotBugs
          validate_sarif .sarif-merged/spotbugs.sarif SpotBugs
          test "$(jq '[.runs[].results[]] | length' .sarif-merged/spotbugs.sarif)" = 2
          jq -e 'all(.runs[].results[].locations[].physicalLocation.artifactLocation;
            .uri == ".github/tests/analysis/annotation-source/com/example/Example.java"
            and (has("uriBaseId") | not))' .sarif-merged/spotbugs.sarif
          git rev-parse HEAD
      - name: Upload real findings and require successful processing
        uses: github/codeql-action/upload-sarif@7fd177fa680c9881b53cdab4d346d32574c9f7f4
        with:
          sarif_file: .sarif-merged/spotbugs.sarif
          category: validation-real-spotbugs
          wait-for-processing: true
